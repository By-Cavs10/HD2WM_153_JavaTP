<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- UIkit CSS -->
    <link rel="stylesheet" href="/vendor/uikit/css/uikit.min.css"/>

    <!-- UIkit JS -->
    <script src="/vendor/uikit/js/uikit.min.js"></script>
    <script src="/vendor/uikit/js/uikit-icons.min.js"></script>

    <!-- Fontawesome CSS -->
    <!--  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css"/> -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
          integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous"/>

    <!-- My Theme -->
    <link rel="stylesheet" href="/eni-theme.css"/>
    <link rel="stylesheet" href="/eni-movie-detail.css"/>

    <meta charset="UTF-8">
    <title layout:fragment="title">Title</title>
</head>
<body>
<header >
    <div>
<!--        <h1>Chauve-Streamer</h1>-->



<!--        <h2>Le Meilleur site pour mater du Chauve</h2>-->


        <nav class="uk-navbar-container eni-navbar-gradient" uk-navbar>
            <div class="uk-navbar-left eni-navbar-btn-padding">
                <a class="uk-navbar-toggle" href="#" uk-toggle="target: #offcanvas-nav">
                    <span uk-navbar-toggle-icon></span>
                </a>
            </div>

            <div class="uk-navbar-center">
                <a class="uk-navbar-item uk-logo" href="home">
                    <img src="/logo.png" class="eni-navbar-logo" alt="Logo">
                </a>
            </div>

<!--            <div class="uk-navbar-right eni-navbar-btn-padding">-->
<!--                <a class="uk-icon-button" href="/login"><i class="fas fa-sign-in-alt"></i></a>-->
<!--            </div>-->

            <!-- Afficher le bouton se connecter si loggedUser est null (donc si pas connecté)-->
            <a th:if="${loggedMember == null}" class="uk-icon-button uk-navbar-right eni-navbar-btn-padding" href="/login"><i class="fas fa-sign-in-alt"></i></a>

            <!-- Afficher le bouton se déconnecter si loggedUser est null (donc si connecté)-->
            <a th:if="${loggedMember}" class="uk-icon-button uk-navbar-right eni-navbar-btn-padding" href="/logout"><i class="fas fa-door-open"></i></a>
        </nav>
        <div id="offcanvas-nav" uk-offcanvas="mode: reveal; overlay: true">
            <div class="uk-offcanvas-bar">
                <ul class="uk-nav uk-nav-default">
                    <li class="uk-active"><a href="home">Accueil</a></li>
                    <li><a href="#">À propos</a></li>
                    <li><a href="#">Contact</a></li>
                    <li><a href="list-movies">Liste Films</a></li>

                </ul>
            </div>
        </div>
    </div>

    <!-- Flash message conditionnel -->
    <!-- Affiche un message temporaire si il existe -->
    <div th:if="${flashMessage}" class="uk-padding-small">
        <div th:classappend="${flashMessage.getTypeCssClass()}" uk-alert>
            <a href class="uk-alert-close" uk-close></a>
            <p th:text="${flashMessage.message}"></p>
        </div>
    </div>


</header>



<div layout:fragment="content"  >

</div>
<footer>
    Coucou
</footer>

</body>
</html>
