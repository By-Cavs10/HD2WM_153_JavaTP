<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" >
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- UIkit CSS -->
    <link rel="stylesheet" href="/vendor/uikit/css/uikit.min.css"/>

    <!-- UIkit JS -->
    <script src="/vendor/uikit/js/uikit.min.js"></script>
    <script src="/vendor/uikit/js/uikit-icons.min.js"></script>

    <!-- Fontawesome CSS -->
    <!--  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css"/> -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
          integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous"/>

    <!-- My Theme -->
    <link rel="stylesheet" href="/eni-theme.css"/>
    <meta charset="UTF-8">
    <title>Home</title>
</head>

<header >
    <div>
        <h1>Chauve-Streamer</h1>



        <h2>Le Meilleur site pour mater du Chauve</h2>
    </div>
</header>

<body class="eni-page-background" th:each="movie : ${movies}">


<div  class="uk-padding-small">
    <div class="eni-movie-card" th:style="'background-image: url(' + @{${movie.photo}} + ');'">
        <div class="eni-movie-card-layer-2">
            <h1 th:text="${movie.title}"></h1><span th:text="${movie.duration} + ' min'"></span>
            <div>
                <i th:each="star: ${maxStars}" class="fa fa-star"
                   th:classappend="${movie.getNote() >= star} ? 'eni-star-check' : ''"></i>
            </div>
            <p th:text="${movie.synopsis}" class="eni-desc"></p>
        </div>
        <a th:href="@{/details-movies/{id}(id=${movie.id})}"  class="eni-movie-card-click">
        </a>
    </div>
</div>
</div>



</body>
</html>
