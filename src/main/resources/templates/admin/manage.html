<!DOCTYPE html>
<html layout:decorate="~{layout/base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>

<body>
<title layout:fragment="title">Manage</title>
<div layout:fragment="content">

  <h1>Manage Members</h1>

  <form th:action="@{/admin/add}" th:object="${member}" method="post">
    <input type="text" th:field="*{firstname}" placeholder="First Name" />
    <input type="text" th:field="*{lastname}" placeholder="Last Name" />
    <input type="email" th:field="*{email}" placeholder="Email" />
    <input type="password" th:field="*{password}" placeholder="Password" />
    <input type="checkbox" th:field="*{isAdmin}" /> Admin
    <button type="submit">Add Member</button>
  </form>

  <h2>Members List</h2>
  <table>
    <tr>
      <th>ID</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Email</th>
      <th>Admin</th>
      <th>Actions</th>
    </tr>
    <tr th:each="member : ${members}">
      <td th:text="${member.id}"></td>
      <td th:text="${member.email}"></td>
      <td th:text="${member.lastname}"></td>
      <td th:text="${member.firstname}"></td>
      <td th:text="${member.password}"></td>
      <td th:text="${member.isAdmin}"></td>
      <td>
        <a th:href="@{/admin/delete/{id}(id=${member.id})}">Delete</a>
      </td>
    </tr>
  </table>

</div>
</body>
</html>
