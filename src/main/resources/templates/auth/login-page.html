<!DOCTYPE html>
<html layout:decorate="~{layout/base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>

<body>
<title layout:fragment="title">Détails</title>
<div layout:fragment="content">


    <body class="eni-page-background">

    <div class="eni-common-page-padding">


        <h1 class="uk-heading-divider uk-text-center">Login</h1>

        <!--    condition message seulement si deconnecté -->
        <div th:if="${param.logout}">Déconnexion réalisée avec succès</div>
        <div th:if="${param.error}">Erreur de Login, tu t'es trompé</div>


<!--        th:object="${member}"-->
        <form  method="POST"  th:action="@{/login}" >

<!--            th:field="*{email}"-->
            <input  class="uk-input" placeholder="saisir l'email" name="username">
<!--            <ul th:if="${#fields.hasErrors('email')}">-->
<!--&lt;!&ndash;                <li class="uk-form-danger" th:each="error: ${#fields.errors('email')}" th:text="${error}"></li>&ndash;&gt;-->
<!--            </ul>-->

<!--            th:field="*{password}" -->
            <input class="uk-input" placeholder="saisir le mot de passe" type="password" name="password"/>

            <div class="uk-margin">
                <input value="Submit" type="submit" class="uk-button uk-button-primary"/>
            </div>

        </form>
    </div>
    </body>
</html>
