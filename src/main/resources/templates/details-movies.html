<!DOCTYPE html>
<html layout:decorate="~{layout/base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>

<body>
<title layout:fragment="title">Détails</title>
<div layout:fragment="content">

    <h2>Detail du film</h2>

    <p th:text="${movie.title}"></p>
    <img th:src="@{${movie.photo}}"/>
    <p th:text="${movie.year}"></p>
    <p th:text="${movie.duration}"></p>
    <p th:text="${movie.note}"></p>
    <p th:text="${movie.synopsis}"></p>

</div>
</body>
</html>
